display_information:
  name: Leo
  description: AI multi-strategy portfolio manager with a custom agent harness
features:
  bot_user:
    display_name: Leo
    always_online: false
oauth_config:
  scopes:
    bot:
      - channels:history
      - app_mentions:read
      - channels:read
      - chat:write
      - groups:read
      - im:read
      - mpim:read
      - groups:history
      - im:history
      - mpim:history
  pkce_enabled: false
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.im
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
  is_mcp_enabled: false
