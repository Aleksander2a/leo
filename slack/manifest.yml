display_information:
  name: Leo
  description: An AI portfolio-research agent that answers in Slack
features:
  bot_user:
    display_name: Leo
    always_online: false
oauth_config:
  # Exactly what the code uses, and nothing else. Leo builds conversation
  # history from what it has itself recorded, so it needs no bulk read scopes.
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - im:history
  pkce_enabled: false
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.im
  interactivity:
    is_enabled: false
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
  is_mcp_enabled: false
