[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "leo-portfolio-agent"
version = "0.1.0"
description = "AI multi-strategy portfolio manager powered by a custom agent harness"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { file = "LICENSE" }
authors = [{ name = "Leo contributors" }]
dependencies = [
  "aiohttp>=3.14,<4",
  "alembic>=1.19,<2",
  "fastapi>=0.141,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.13,<3",
  "pydantic-settings>=2.15,<3",
  "psycopg[binary]>=3.3,<4",
  "slack-bolt>=1.30,<2",
  "sqlalchemy[asyncio]>=2.0.52,<2.1",
  "typer>=0.16,<1",
  "uvicorn[standard]>=0.52,<1",
  "mcp==2.0.0",
  "jsonschema>=4.26,<5",
]

[dependency-groups]
dev = [
  "mypy>=2.3,<3",
  "pytest>=9.1,<10",
  "pytest-asyncio>=1.4,<2",
  "ruff>=0.16,<1",
  "types-jsonschema>=4.26,<5",
]

[project.scripts]
leo = "leo.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/leo"]

[tool.hatch.build.targets.wheel.force-include]
"evals/scenarios" = "leo/evals/scenarios"

[tool.hatch.build.targets.sdist]
include = [
  "/src/leo",
  "/resources",
  "/evals/scenarios",
  "/migrations",
  "/alembic.ini",
  "/README.md",
  "/LICENSE",
  "/pyproject.toml",
  "/uv.lock",
]
exclude = ["/.env*", "/tests", "/.leo-planning", "/.pytest-tmp*"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "strict"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom calls Depends()/Query() in argument defaults by
# design; this tells bugbear's B008 that those specific calls are not the mutable-default
# footgun it otherwise guards against.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["leo"]
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["slack_bolt.*"]
ignore_missing_imports = true
