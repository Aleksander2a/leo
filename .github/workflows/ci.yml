name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      UV_CACHE_DIR: .uv-cache
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install ${{ matrix.python-version }}
      - run: uv python pin ${{ matrix.python-version }}
      - run: uv sync --locked --dev
      # Prime the shared cache with the PEP 517 backend before the quality
      # gate intentionally builds the artifacts offline. Editable sync alone
      # does not need to resolve hatchling.
      - name: Prime offline build cache
        run: uv build --cache-dir "$UV_CACHE_DIR" --out-dir "${{ runner.temp }}/leo-build-bootstrap"
      - run: uv run python scripts/quality.py

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
